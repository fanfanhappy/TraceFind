[package]
name = "tracefind"
version = "2.1.1"
description = "TraceFind · Windows 本地文件搜索"
authors = ["TraceFind"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
pinyin = "0.10"
notify = "8"
zip = "2"
quick-xml = "0.36"
encoding_rs = "0.8"
pdf-extract = "0.12"
base64 = "0.22"
fastembed = "7"
ureq = { version = "2", features = ["json", "tls"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com"] }
windows = { version = "0.58", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Data_Pdf"] }

[features]
# 生产构建必须带上：缺少它时 Tauri 会走 devUrl（127.0.0.1:1420），
# 双击 exe 只会看到“无法访问此页面”。`tauri build` 会自动加这个 feature。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
strip = true
